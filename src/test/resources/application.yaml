# 테스트는 H2를 쓴다. 테스트 리소스가 메인 설정을 대신한다.
spring:
  application:
    name: AuDDum
  datasource:
    url: jdbc:h2:mem:auddum;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # 스키마는 Flyway가 만든다. Hibernate가 덮어쓰지 않게 한다.
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

auddum:
  frontend:
    base-url: http://localhost:3000
  auth:
    cookie-secure: true
    jwt:
      secret: test-only-jwt-secret-key-test-only-0123456789
  anon-cookie:
    secret: test-only-anon-cookie-secret-test-only-0123456789

management:
  # 메인 application.yaml의 management와 같게 유지한다. 테스트 리소스가 메인을 가려서 복제했다(sketch 155 질문 6).
  # 웹에 여는 Actuator 엔드포인트는 health 하나다. 지표 노출은 모니터링 작업(#23)이 넓힌다.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # 켜 두면 응답에 groups(liveness, readiness)가 함께 나온다. 응답을 status 하나로 둔다.
      probes:
        enabled: false
